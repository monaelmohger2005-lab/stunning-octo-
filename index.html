 <!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نظام إدارة نتائج الطلاب</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">

        <h1 class="text-center mb-4">
            نظام إدارة نتائج الطلاب
        </h1>

        <div class="card shadow p-4">

            <h3 class="mb-4">إضافة طالب جديد</h3>

            <label class="form-label">اسم الطالب</label>
            <input type="text" id="studentName"
                class="form-control mb-3"
                placeholder="أدخل اسم الطالب">

            <label class="form-label">درجة المادة الأولى</label>
            <input type="number" id="grade1"
                class="form-control mb-3"
                min="0" max="100">

            <label class="form-label">درجة المادة الثانية</label>
            <input type="number" id="grade2"
                class="form-control mb-3"
                min="0" max="100">

            <label class="form-label">درجة المادة الثالثة</label>
            <input type="number" id="grade3"
                class="form-control mb-3"
                min="0" max="100">

            <label class="form-label">نسبة الحضور</label>
            <input type="number" id="attendance"
                class="form-control mb-3"
                min="0" max="100">

            <button id="addStudent" class="btn btn-primary mb-3">
                إضافة طالب
            </button>

            <button id="mercyCommittee" class="btn btn-success">
                تفعيل لجنة الرأفة
            </button>

        </div>

        <div id="errorBox" class="text-danger mt-3"></div>

        <div class="card shadow p-4 mt-4">
            <h3>قائمة الطلاب المضافين</h3>
            <div id="studentsList"></div>
        </div>

        <div class="card shadow p-4 mt-4">
            <h3>التقرير النهائي للجنة الرأفة</h3>
            <div id="report"></div>
        </div>

    </div>

    <script src="main.js"></script>

</body>
</html>
